name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test PernoCore (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --package-path Packages/PernoCore

  build-ios:
    name: Build .ipa (iOS)
    runs-on: macos-15-intel
    needs: test-linux
    steps:
      - uses: actions/checkout@v5

      - name: Seleziona Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$X" || { echo "Xcode 26 non disponibile su questo runner"; exit 1; }
          sudo xcode-select -s "$X"

      - name: Xcode in uso
        run: xcodebuild -version

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build non firmata
        run: |
          set -o pipefail
          xcodebuild \
            -project Perno.xcodeproj \
            -scheme Perno \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Verifica i font nell'app
        run: |
          APP=build/Build/Products/Release-iphoneos/Perno.app
          for f in BarlowCondensed-Medium.ttf BarlowCondensed-SemiBold.ttf; do
            test -f "$APP/$f" || { echo "Manca $f nel bundle"; exit 1; }
          done
          plutil -extract UIAppFonts json -o - "$APP/Info.plist"

      - name: Verifica la Live Activity nell'app
        run: |
          APP=build/Build/Products/Release-iphoneos/Perno.app
          EXT="$APP/PlugIns/PernoWidget.appex"
          test -d "$EXT" || { echo "Manca PernoWidget.appex in PlugIns"; exit 1; }
          plutil -extract NSSupportsLiveActivities raw -o - "$APP/Info.plist"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$EXT/Info.plist"
          for f in BarlowCondensed-Medium.ttf BarlowCondensed-SemiBold.ttf; do
            test -f "$EXT/$f" || { echo "Manca $f nell'estensione"; exit 1; }
          done

      - name: Crea Perno.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Perno.app Payload/
          zip -qry Perno.ipa Payload
          ls -lh Perno.ipa

      - name: Allega alla run
        uses: actions/upload-artifact@v4
        with:
          name: Perno-${{ github.run_number }}
          path: Perno.ipa

      - name: Pubblica la release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Perno build ${{ github.run_number }}
          prerelease: true
          body: |
            Build automatica di `${{ github.sha }}`.
            Sul telefono: scarica Perno.ipa e aprilo con SideStore.
          files: Perno.ipa
