name: Perno

options:
  bundleIdPrefix: com.pensa95
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PernoCore:
    path: Packages/PernoCore

targets:
  Perno:
    type: application
    platform: iOS
    sources:
      - path: Perno
      - path: Shared
    dependencies:
      - package: PernoCore
      - target: PernoWidget
        embed: true
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Perno
        UILaunchScreen:
          UIColorName: Lamiera
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.pensa95.perno
            CFBundleURLSchemes:
              - perno
        UIAppFonts:
          - BarlowCondensed-Medium.ttf
          - BarlowCondensed-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pensa95.perno
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}

  # Live Activity della sessione (blocco schermo e Dynamic Island).
  PernoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PernoWidget
      - path: Shared
      - path: Perno/DesignSystem/Theme.swift
      - path: Perno/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: PernoCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Support/PernoWidget-Info.plist
      properties:
        CFBundleDisplayName: Perno
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - BarlowCondensed-Medium.ttf
          - BarlowCondensed-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pensa95.perno.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
